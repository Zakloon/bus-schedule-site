<meta name="apple-mobile-web-app-title" content="BusMUPAT">

<style>
/* Layout: one column over a northern-lights night photo. Panels are dark glass so text stays readable.
   Palette is taken from the photo: deep night navy, aurora green, and a teal that sits between them. */
:root{
  --bg:#060D1A;
  --surface:rgba(8,18,32,.76);
  --ink:#EAF7F1;
  --muted:#A6C2B8;
  --line:rgba(150,235,200,.22);
  --accent:#3DDC97;
  --accent-ink:#04170D;
  --accent-soft:rgba(61,220,151,.18);
  --teal:#1FA58A;
  --field:rgba(4,12,22,.85);
  --chip:rgba(4,12,22,.6);
  color-scheme: dark;
}
/* Light theme, chosen in settings. Only colours change; the layout is the same. */
:root[data-theme="light"]{
  --bg:#EAF4F0;
  --surface:rgba(255,255,255,.8);
  --field:rgba(255,255,255,.95);
  --chip:rgba(255,255,255,.7);
  --ink:#0C2B23;
  --muted:#4D6E65;
  --line:rgba(20,100,80,.2);
  --accent-soft:rgba(31,165,138,.16);
  color-scheme: light;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100dvh; color:var(--ink); background-color:var(--bg);
  background-image:radial-gradient(120% 60% at 50% 0%, rgba(61,220,151,.14), transparent 60%),
                   radial-gradient(90% 50% at 50% 100%, rgba(31,165,138,.12), transparent 70%);
  background-attachment:fixed;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 40px;
}
.banner{max-width:720px;margin:0 auto 16px}
@media (max-width:600px){
  body{font-size:18px;padding-block:14px 32px}
  .banner,.wrap{max-width:none}
  .banner img{border-radius:18px}
  .wrap{gap:16px}
  h1{font-size:30px}
  h2{font-size:17px}
  .head p{font-size:17px}
  .field label{font-size:16px}
  .field select{min-height:62px;font-size:19px;padding:14px 16px;border-radius:16px}
  .seg button{font-size:17px;padding:14px 12px;flex:1 1 100%}
  .card{padding:18px;border-radius:22px}
  .card-head span{font-size:16px}
  .hero{padding:24px 22px 22px;border-radius:24px}
  .hlabel{font-size:17px}
  .big{font-size:68px}
  .sub{font-size:20px}
  .later{font-size:18px}
  .trips{grid-template-columns:repeat(2,1fr);gap:10px}
  .trip{font-size:18px;padding:14px 8px;border-radius:14px}
  .trip-note{font-size:16px}
  .msg{font-size:18px}
  footer{font-size:16px}
  .badge{width:60px;height:60px;font-size:24px;border-radius:18px}
  .pick .badge{width:56px;height:56px;font-size:21px}
}
.banner img{display:block;width:100%;height:auto;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2{font-family:"Unbounded",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 16px rgba(0,0,0,.45)}
h2{font-size:14px;font-weight:600;letter-spacing:.02em}
.hidden{display:none!important}

.badge{
  --h:160; width:52px;height:52px;flex:none;border-radius:16px;
  background:linear-gradient(135deg, hsl(var(--h) 75% 58%), hsl(var(--h) 70% 36%));
  color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35);
  display:grid;place-items:center;font-family:"Unbounded",sans-serif;font-weight:800;font-size:20px;
  font-variant-numeric:tabular-nums;
}
.head{display:flex;flex-direction:column;gap:6px}
.head p{margin:0;color:var(--muted)}

/* Dropdowns for route and stops */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field select{
  width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--field);color:var(--ink);font:inherit;font-size:15px;font-weight:600;
  overflow-wrap:anywhere;
}
.field select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{display:flex;align-items:flex-end;gap:12px;min-width:0}
.pick .badge{width:48px;height:48px;border-radius:15px;font-size:18px;margin-bottom:1px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.card-head span{color:var(--muted);font-size:13px}

/* Segmented buttons: active one is aurora green */
.seg{
  display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.seg button{
  flex:1 1 120px;min-width:0;border:0;background:transparent;color:var(--muted);
  padding:10px 12px;border-radius:12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:center;
  transition:background .15s, color .15s;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{
  background:linear-gradient(135deg,#5BF0AE,var(--accent)); color:var(--accent-ink);
  box-shadow:0 4px 14px rgba(61,220,151,.28);
}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Hero: next trip between the two chosen stops */
.hero{
  background:linear-gradient(135deg,#5BF0AE 0%,var(--accent) 45%,var(--teal) 100%);
  color:var(--accent-ink);border-radius:22px;padding:20px 20px 18px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.hlabel{font-size:13px;font-weight:600;opacity:.85;overflow-wrap:anywhere}
.big{font-family:"Unbounded",sans-serif;font-weight:800;font-size:56px;line-height:1.05;margin:6px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{font-weight:700;font-size:16px}
.later{margin-top:10px;font-size:14px;opacity:.9;font-variant-numeric:tabular-nums}

.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.trip{
  text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--chip);
  font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;
}
.trip.past{opacity:.35}
.trip.next{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 14px rgba(61,220,151,.25)}
.trip-note{font-size:13px;color:var(--muted);margin:10px 0 0}

footer{color:var(--muted);font-size:13px;line-height:1.5;padding:0 4px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
footer a{color:var(--ink);text-underline-offset:3px}
.msg{padding:24px;text-align:center;color:var(--muted)}

/* Settings button (gear) and sheet */
.gear{
  position:fixed; top:max(12px,env(safe-area-inset-top,0px)); right:max(12px,env(safe-area-inset-right,0px)); z-index:20;
  width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  display:grid; place-items:center; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.3);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; padding:16px}
.sheet[hidden]{display:none}
.sheet-box{
  width:100%; max-width:520px; background:var(--bg); color:var(--ink); border:1px solid var(--line);
  border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:18px;
  padding-bottom:max(18px, env(safe-area-inset-bottom,0px));
}
.sheet-head{display:flex; justify-content:space-between; align-items:center}
.sheet-head h2{font-size:17px}
.sheet-close{width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-size:16px}
.set-row{display:flex; flex-direction:column; gap:8px}
.set-row > span{font-weight:700; color:var(--muted); font-size:14px}
@media (max-width:600px){
  .gear{width:56px; height:56px}
  .gear svg{width:26px; height:26px}
  .sheet-head h2{font-size:20px}
  .set-row > span{font-size:17px}
  .set-row .seg button{font-size:17px; padding:14px 10px}
  .sheet-close{width:50px; height:50px; font-size:18px}
}

/* Top navigation: available on every screen */
.topnav{display:flex;gap:8px}
.topnav a{
  flex:1 1 0;text-align:center;padding:12px 10px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.topnav a:first-child{color:var(--muted)}
.topnav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty-fav{margin:0;color:var(--muted);font-size:15px}
@media (max-width:600px){
  .topnav a{font-size:18px;padding:16px 10px;border-radius:16px}
  .empty-fav{font-size:17px}
}

/* Favourite routes */
.fav-btn{
  width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);cursor:pointer;
  background:var(--field);color:var(--ink);font-family:inherit;font-weight:700;font-size:15px;
}
.fav-btn[aria-pressed="true"]{background:linear-gradient(135deg,#5BF0AE,var(--accent));color:var(--accent-ink);border-color:transparent}
.fav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fav-btn small{display:block;font-weight:600;font-size:13px;opacity:.85;margin-top:2px}
.fav-path{display:block;color:var(--muted);font-size:14px;font-weight:600}
.fav-list{display:flex;flex-wrap:wrap;gap:8px}
.fav-list{display:flex;flex-direction:column;gap:10px}
.fav-item{
  display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);text-decoration:none;min-width:0;
}
.fav-item .badge{width:46px;height:46px;font-size:17px;border-radius:14px}
.fav-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.fav-txt b{font-size:15px;overflow-wrap:anywhere}
.fav-txt small{color:var(--accent);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.next-line{font-size:15px;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.next-line b{color:var(--accent);font-weight:700}
@media (max-width:600px){
  .fav-btn{min-height:58px;font-size:18px;border-radius:16px}
  .fav-item{padding:16px;border-radius:18px;gap:16px}
  .fav-item .badge{width:56px;height:56px;font-size:21px;border-radius:16px}
  .fav-txt b{font-size:19px}
  .fav-txt small{font-size:17px}
  .next-line{font-size:18px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<button type="button" class="gear" id="settings-btn" aria-label="Настройки" title="Настройки">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

</div>
<header class="banner"><img src="bg.jpg" alt="Фото северного сияния"></header>

<main class="wrap" id="app"><p class="msg">Загружаю расписание…</p></main>

<script>
const LABELS = { weekday:"Будни", weekend:"Выходные", daily:"Ежедневно", sat:"Суббота", sun:"Воскресенье" };
const app = document.getElementById("app");
let ROUTES = [];
const ui = { state: {} };

/* Settings: text size and theme, remembered on this device. Unknown or broken values fall back to the defaults. */
const SIZES = ["1", "1.15", "1.3"];
const PREFS = { size: "1", theme: "dark" };
try {
  const saved = JSON.parse(localStorage.getItem("mupat-prefs") || "{}");
  if (SIZES.includes(String(saved.size))) PREFS.size = String(saved.size);
  if (saved.theme === "light" || saved.theme === "dark") PREFS.theme = saved.theme;
} catch (e) {}
function savePrefs(){
  try { localStorage.setItem("mupat-prefs", JSON.stringify(PREFS)); } catch (e) {}
}
function syncSettings(){
  document.querySelectorAll("[data-size-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sizeSet === PREFS.size)));
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === PREFS.theme)));
}
function applyPrefs(){
  document.documentElement.dataset.theme = PREFS.theme;
  app.style.zoom = PREFS.size;
  syncSettings();
}
applyPrefs();

/* Yekaterinburg clock (UTC+5), independent of the viewer's time zone. */
function now(){
  const d = new Date(Date.now() + 5 * 3600e3);
  return { dow: d.getUTCDay(), min: d.getUTCHours() * 60 + d.getUTCMinutes() };
}
const fmt = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
function until(m){
  if (m < 1) return "сейчас";
  const h = Math.floor(m / 60), x = m % 60;
  return h ? `через ${h} ч ${x} мин` : `через ${x} мин`;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
/* Badge hues stay in the aurora range (green to teal) so every route matches the palette. */
const hue = id => 150 + ((parseInt(id, 10) * 29) % 45);
const labelsOf = r => [...new Set(r.blocks.map(b => b.label))];

function defaultLabel(r, dow){
  const prefs = dow === 0 ? ["sun","weekend","weekday","daily"]
              : dow === 6 ? ["sat","weekend","weekday","daily"]
              : ["weekday","daily","weekend","sat","sun"];
  const avail = labelsOf(r);
  return prefs.find(p => avail.includes(p)) || avail[0];
}
/* Favourite routes are kept on this device only (localStorage). Every access is guarded, so the page still works without storage. */
/* A favourite is a route plus the boarding and alighting stop names (older entries hold only the route id). */
function favs(){
  try {
    const a = JSON.parse(localStorage.getItem("mupat-favs") || "[]");
    return (Array.isArray(a) ? a : []).map(x => typeof x === "string" ? { id: x, from: null, to: null } : x).filter(x => x && x.id);
  } catch (e) { return []; }
}
const favKey = f => f.id + "|" + (f.from || "") + "|" + (f.to || "");
function isFav(id, from, to){
  const k = favKey({ id, from, to });
  return favs().some(f => favKey(f) === k);
}
function toggleFav(id, from, to){
  const k = favKey({ id, from, to });
  const list = favs();
  const next = list.some(f => favKey(f) === k) ? list.filter(f => favKey(f) !== k) : [...list, { id, from, to }];
  try { localStorage.setItem("mupat-favs", JSON.stringify(next)); } catch (e) {}
}
const currentRoute = () => { const m = location.hash.match(/^#route-(\d+)$/); return m ? ROUTES.find(x => x.id === m[1]) : undefined; };

/* Route state: day, direction, boarding stop (from), alighting stop (to). Remembered per route in this session. */
function ctx(r){
  const n = now();
  let st = ui.state[r.id];
  if (!st){ st = { label: defaultLabel(r, n.dow), dir: 0, from: 0, to: null }; ui.state[r.id] = st; }
  const labels = labelsOf(r);
  if (!labels.includes(st.label)) st.label = labels[0];
  const blocks = r.blocks.filter(b => b.label === st.label);
  if (st.dir >= blocks.length) st.dir = 0;
  const stops = blocks[st.dir].stops;
  const last = stops.length - 1;
  if (st.from < 0 || st.from > last) st.from = 0;
  if (st.to === null || st.to > last || st.to <= st.from) st.to = last;
  return { n, st, labels, blocks, stops, last };

}

/* Trips between two stops. Each departure from "from" is paired with the time at "to" nearest to the typical travel time. */
function tripsBetween(stops, a, b){
  const A = stops[a][1], B = stops[b][1];
  const diffs = [];
  for (let i = 0; i < Math.min(A.length, B.length); i++) diffs.push(B[i] - A[i]);
  diffs.sort((x, y) => x - y);
  const travel = diffs.length ? diffs[Math.floor(diffs.length / 2)] : 0;
  return A.map(dep => {
    const target = dep + travel;
    const arr = B.length ? B.reduce((best, t) => Math.abs(t - target) < Math.abs(best - target) ? t : best) : undefined;
    return { dep, arr, travel };
  });
}

function liveHTML(stops, st, n){
  const a = st.from, b = st.to;
  const trips = tripsBetween(stops, a, b);
  const fromName = stops[a][0], toName = stops[b][0];
  const stopsOnWay = b - a;
  const nextI = trips.findIndex(t => t.dep >= n.min);
  let big, sub, later;
  if (trips.length === 0){
    big = "—"; sub = "Нет рейсов"; later = "";
  } else if (nextI < 0){
    big = fmt(trips[0].dep); sub = "Сегодня рейсов больше нет"; later = `Первый рейс завтра: ${fmt(trips[0].dep)}`;
  } else {
    const t = trips[nextI];
    big = fmt(t.dep); sub = until(t.dep - n.min);
    later = t.arr !== undefined ? `Приедет на «${esc(toName)}» около ${fmt(t.arr)} · в пути ~${t.travel} мин` : "";
  }
  const list = trips.map((t, i) => {
    const past = nextI < 0 ? true : i < nextI;
    const cls = [past ? "past" : "", i === nextI ? "next" : ""].join(" ").trim();
    return `<span class="trip ${cls}">${fmt(t.dep)} → ${t.arr !== undefined ? fmt(t.arr) : "—"}</span>`;
  }).join("");
  return `
    <section class="hero" aria-live="polite">
      <div class="hlabel">От «${esc(fromName)}» до «${esc(toName)}» · остановок по пути: ${stopsOnWay}</div>
      <div class="big">${big}</div>
      <div class="sub">${sub}</div>
      <div class="later">${later}</div>
    </section>
    <section class="card" style="margin-top:16px">
      <div class="card-head"><h2>Все рейсы</h2><span>${trips.length} в день · отправление → прибытие</span></div>
      <div class="trips">${list}</div>
      <p class="trip-note">Время прибытия рассчитано по типичному времени в пути, поэтому может отличаться на 1–2 минуты.</p>
    </section>`;
}

function routeOptions(selectedId){
  return `<option value="" ${selectedId ? "" : "selected"} disabled>Выберите маршрут</option>` +
    ROUTES.map(r => `<option value="${esc(r.id)}" ${r.id === selectedId ? "selected" : ""}>${esc(r.id)} · ${esc(r.name)}</option>`).join("");
}

/* Next departure of a route for the whole line (first stop to last), on the day that applies today. */
function nextInfo(r){
  const n = now();
  const label = defaultLabel(r, n.dow);
  const blocks = r.blocks.filter(b => b.label === label);
  if (!blocks.length) return null;
  const stops = blocks[0].stops, last = stops.length - 1;
  if (last < 1) return null;
  const t = tripsBetween(stops, 0, last).find(x => x.dep >= n.min);
  return t ? { dep: t.dep, left: t.dep - n.min } : null;
}
/* Finds the direction in which both named stops occur, in order. */
function matchTrip(r, fromName, toName, label){
  const blocks = r.blocks.filter(b => b.label === label);
  for (let d = 0; d < blocks.length; d++){
    const names = blocks[d].stops.map(s => s[0]);
    const a = names.indexOf(fromName), z = names.indexOf(toName);
    if (a >= 0 && z > a) return { dir: d, a, z, stops: blocks[d].stops };
  }
  return null;
}
function nextFor(r, fromName, toName){
  const n = now();
  const m = matchTrip(r, fromName, toName, defaultLabel(r, n.dow));
  if (!m) return null;
  const t = tripsBetween(m.stops, m.a, m.z).find(x => x.dep >= n.min);
  return t ? { dep: t.dep, left: t.dep - n.min } : null;
}
function favRoutesList(){
  return favs().map(f => {
    const r = ROUTES.find(x => x.id === f.id);
    return r ? { r, from: f.from, to: f.to } : null;
  }).filter(Boolean);
}
function favItemsHTML(list){
  return list.map(({ r, from, to }) => {
    const hasStops = !!(from && to);
    const x = hasStops ? nextFor(r, from, to) : nextInfo(r);
    const when = x ? `${fmt(x.dep)} · ${until(x.left)}` : "сегодня рейсов больше нет";
    const path = hasStops ? `<small class="fav-path">от «${esc(from)}» до «${esc(to)}»</small>` : "";
    return `<a class="fav-item" href="#route-${esc(r.id)}" data-open-id="${esc(r.id)}" data-open-from="${esc(from || "")}" data-open-to="${esc(to || "")}">
      <span class="badge" style="--h:${hue(r.id)}">${esc(r.id)}</span>
      <span class="fav-txt"><b>${esc(r.name)}</b>${path}<small>Ближайший: ${when}</small></span>
    </a>`;
  }).join("");
}
function favListHTML(){
  const list = favRoutesList();
  if (!list.length) return `<section class="card" id="fav-section">
      <div class="card-head"><h2>Избранное</h2></div>
      <p class="empty-fav">Пока пусто. Откройте маршрут, выберите остановки и нажмите «☆ Добавить в избранное».</p>
    </section>`;
  return `<section class="card" id="fav-section">
      <div class="card-head"><h2>Избранное</h2><span>${list.length}</span></div>
      <div class="fav-list" id="favs">${favItemsHTML(list)}</div>
    </section>`;
}
function navHTML(){
  return `<nav class="topnav" aria-label="Навигация"><a href="#">Все маршруты</a><a href="#favs">★ Избранное</a></nav>`;
}

/* «Все маршруты»: only the route picker. */
function renderIndex(){
  app.innerHTML = `
    ${navHTML()}
    <header class="head">
      <h1>Автобусы МУПАТ</h1>
      <p>Расписание маршрутов Нового Уренгоя и Коротчаево. Выберите маршрут из списка.</p>
    </header>
    <section class="card">
      <div class="field">
        <label for="route-select">Маршрут</label>
        <select id="route-select" data-role="route">${routeOptions(null)}</select>
      </div>
    </section>
    <footer>Расписание взято с сайта <a href="https://mupat.ru/raspisanie" target="_blank" rel="noopener">mupat.ru</a>.
      Время отправления может меняться из-за дорожной обстановки. Время показано по Екатеринбургу (UTC+5).
      Праздничные дни не учтены: выберите нужный день вручную.</footer>`;
}

function nextLine(r){
  const c = ctx(r);
  const t = tripsBetween(c.stops, c.st.from, c.st.to).find(x => x.dep >= c.n.min);
  const x = t ? { dep: t.dep, left: t.dep - c.n.min } : null;
  return x
    ? `<div class="next-line">Ближайший рейс: <b>${fmt(x.dep)}</b> · ${until(x.left)}</div>`
    : `<div class="next-line">Сегодня рейсов больше нет</div>`;
}

function renderRoute(r){
  const { n, st, labels, blocks, stops, last } = ctx(r);
  const daySeg = labels.length > 1
    ? `<div class="seg" role="group" aria-label="День">${labels.map(l =>
        `<button type="button" data-label="${esc(l)}" aria-pressed="${l === st.label}">${LABELS[l] || esc(l)}</button>`).join("")}</div>` : "";
  const dirSeg = blocks.length > 1
    ? `<div class="seg" role="group" aria-label="Направление">${blocks.map((b, i) =>
        `<button type="button" data-dir="${i}" aria-pressed="${i === st.dir}">${esc(b.dir)}</button>`).join("")}</div>` : "";
  const fromOpts = stops.slice(0, last).map(([name], i) =>
    `<option value="${i}" ${i === st.from ? "selected" : ""}>${i + 1}. ${esc(name)}</option>`).join("");
  const toOpts = stops.map(([name], i) => i > st.from
    ? `<option value="${i}" ${i === st.to ? "selected" : ""}>${i + 1}. ${esc(name)}</option>` : "").join("");

  app.innerHTML = `
    ${navHTML()}
    <header class="pick" style="--h:${hue(r.id)}">
      <span class="badge">${esc(r.id)}</span>
      <div class="field" style="flex:1">
        <label for="route-select">Маршрут</label>
        <select id="route-select" data-role="route">${routeOptions(r.id)}</select>
      </div>
    </header>
    ${nextLine(r)}
    <button type="button" class="fav-btn" data-toggle-id="${esc(r.id)}" data-toggle-from="${esc(stops[st.from][0])}" data-toggle-to="${esc(stops[st.to][0])}" aria-pressed="${isFav(r.id, stops[st.from][0], stops[st.to][0])}">
      <span>${isFav(r.id, stops[st.from][0], stops[st.to][0]) ? "★ В избранном" : "☆ Добавить в избранное"}</span>
      <small>${esc(stops[st.from][0])} → ${esc(stops[st.to][0])}</small>
    </button>
    ${daySeg}
    ${dirSeg}
    <section class="card">
      <div class="field">
        <label for="from-select">Откуда (посадка)</label>
        <select id="from-select" data-role="from">${fromOpts}</select>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="to-select">Куда (высадка)</label>
        <select id="to-select" data-role="to">${toOpts}</select>
      </div>
    </section>
    <div id="live">${liveHTML(stops, st, n)}</div>
    <footer>Время отправления может меняться из-за дорожной обстановки. Время показано по Екатеринбургу (UTC+5).</footer>`;
}

/* «Избранное»: only the saved routes, no route picker. */
function renderFavs(){
  app.innerHTML = `
    ${navHTML()}
    <header class="head">
      <h1>Избранное</h1>
      <p>Ваши маршруты с выбранными остановками и ближайшим рейсом.</p>
    </header>
    ${favListHTML()}`;
}

function render(){
  const r = currentRoute();
  if (r){ renderRoute(r); window.scrollTo(0, 0); return; }
  if (location.hash === "#favs") renderFavs(); else renderIndex();
  window.scrollTo(0, 0);
}

/* Changes to dropdowns and buttons. */
app.addEventListener("change", e => {
  const role = e.target.dataset.role;
  if (role === "route"){
    if (e.target.value) location.hash = "#route-" + e.target.value;
    return;
  }
  const r = currentRoute();
  if (!r) return;
  const st = ui.state[r.id];
  if (role === "from"){
    st.from = Number(e.target.value);
    const last = ctx(r).last;
    st.to = Math.min(Math.max(st.to ?? last, st.from + 1), last);
  }
  if (role === "to") st.to = Number(e.target.value);
  render();
});
app.addEventListener("click", e => {
  const f = e.target.closest("[data-toggle-id]");
  if (f){ toggleFav(f.dataset.toggleId, f.dataset.toggleFrom, f.dataset.toggleTo); render(); return; }
  /* Opening a favourite restores its boarding and alighting stops. */
  const fi = e.target.closest("[data-open-id]");
  if (fi && fi.dataset.openFrom){
    const r = ROUTES.find(x => x.id === fi.dataset.openId);
    const label = r && defaultLabel(r, now().dow);
    const m = r && matchTrip(r, fi.dataset.openFrom, fi.dataset.openTo, label);
    if (m) ui.state[r.id] = { label, dir: m.dir, from: m.a, to: m.z };
  }
  const b = e.target.closest("[data-label],[data-dir]");
  if (!b) return;
  const r = currentRoute();
  if (!r) return;
  const st = ui.state[r.id];
  if (b.dataset.label !== undefined){ st.label = b.dataset.label; st.dir = 0; st.from = 0; st.to = null; }
  if (b.dataset.dir !== undefined){ st.dir = Number(b.dataset.dir); st.from = 0; st.to = null; }
  render();
});
window.addEventListener("hashchange", render);

/* Gear button and settings sheet. */
const settingsEl = document.getElementById("settings");
document.addEventListener("click", e => {
  if (e.target.closest("#settings-btn")){ settingsEl.hidden = false; syncSettings(); return; }
  if (e.target === settingsEl || e.target.closest("[data-close]")){ settingsEl.hidden = true; return; }
  const s = e.target.closest("[data-size-set]");
  if (s){ PREFS.size = s.dataset.sizeSet; savePrefs(); applyPrefs(); return; }
  const t = e.target.closest("[data-theme-set]");
  if (t){ PREFS.theme = t.dataset.themeSet; savePrefs(); applyPrefs(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") settingsEl.hidden = true; });

fetch("routes.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    ROUTES = d; render();
    setInterval(() => {
      const r = currentRoute();
      const live = document.getElementById("live");
      if (r && live){ const c = ctx(r); live.innerHTML = liveHTML(c.stops, c.st, now()); }
      const fl = document.getElementById("favs");
      if (!r && fl) fl.innerHTML = favItemsHTML(favRoutesList());
    }, 30000);
  })
  .catch(() => { app.innerHTML = '<p class="msg">Не удалось загрузить расписание. Обновите страницу.</p>'; });
</script>
